[package]
name = "wavcraft"
description = "WavCraft: a single-file waveform editor on SoundCraft's engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
wavcraft-core.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui.workspace = true
cpal.workspace = true
rfd.workspace = true
log.workspace = true
craft-log.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-dsp.workspace = true
mix-audio-io.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
# The token file's owner-only DACL (win_acl.rs). Already in Cargo.lock (0.61.2: wavcraft-testkit,
# dirs-sys), so no new crate; these features add the Win32 security calls. MIT OR Apache-2.0.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

# The workspace forbids `unsafe`. This crate only denies it, so the Windows ACL calls in
# win_acl.rs can be allowed there and nowhere else (the second and last exception; README).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
