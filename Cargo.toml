[workspace]
resolver = "3"
members = ["crates/core", "crates/testkit", "crates/craft-log", "crates/craft-stage", "apps/wavcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
wavcraft-core = { path = "crates/core" }
# Self-logging (SELF-LOGGING.md), the same crates the Craft forks carry, copied from PhotoCraft `ours`.
craft-log = { path = "crates/craft-log" }

# SoundCraft's engine crates, all pinned to ONE commit of our fork: the head of its
# feat/disk-backed-source branch (iannitram/soundcraft#34), which is the old pin
# (dc253f2, tag `wavecraft-pin-2026-10-12`) plus upstream sync merges, the streaming
# `FileEncoder`, and decode hardening for malformed files. One audio-io version in the tree, so
# the model's `Source::format` and our decoder share one `FileFormat`. Bump deliberately; see
# README. Once that branch is merged, move the pin to the fork's `ours`. Licences MIT OR Apache-2.0.
soundcraft-audio-io = { git = "https://github.com/iannitram/soundcraft", rev = "e85de960b5bc410357e89f4a16a2c5190238c829" }
soundcraft-model = { git = "https://github.com/iannitram/soundcraft", rev = "e85de960b5bc410357e89f4a16a2c5190238c829" }
soundcraft-time = { git = "https://github.com/iannitram/soundcraft", rev = "e85de960b5bc410357e89f4a16a2c5190238c829" }

rustfft = "6"
rayon = "1"
log = "0.4"
cpal = "0.16"
egui = "0.36"
eframe = { version = "0.36", default-features = false }
rfd = "0.17"
# Task 03 (the on-disk store and streamed open). Licences: symphonia MPL-2.0 (already in the tree
# through soundcraft-audio-io, same version and features so both decode alike), bytemuck
# Zlib/Apache-2.0/MIT, dirs MIT/Apache-2.0, sysinfo MIT (its "disk" feature since item 03b: free
# space on the session folder's disk), proptest MIT/Apache-2.0.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff", "isomp4", "aac", "alac", "adpcm", "caf", "mkv"] }
bytemuck = "1.25"
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
proptest = "1.11"
# The Legion Go review's W7 (2026-10-16): free space asked of the session folder's own file
# system (`statvfs`) on Unix, so a tmpfs isn't matched to `/`. Already in Cargo.lock (1.1.5,
# through tempfile and others), so no new crate; its safe API keeps `unsafe` forbidden here.
# Licence Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT.
rustix = { version = "1.1", features = ["fs"] }
# Codex review CX-W2/W4 (2026-10-19): random names and tokens from the operating system's CSPRNG.
# Already in Cargo.lock (0.4.3, through other crates), so no new crate. Licence MIT OR Apache-2.0.
getrandom = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
