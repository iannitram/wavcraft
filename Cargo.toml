[workspace]
resolver = "3"
members = ["crates/core", "crates/testkit", "crates/craft-log", "crates/craft-stage", "apps/wavcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
wavcraft-core = { path = "crates/core" }
# Self-logging (SELF-LOGGING.md), the same crates the Craft forks carry, copied from PhotoCraft `ours`.
craft-log = { path = "crates/craft-log" }

# SoundCraft's engine crates, ALL pinned to one commit of our fork since 2026-10-26: 274f788, the
# head of `feat/streamed-readahead` (upstream v0.5.0 plus our merged fixes: long-file handling,
# parallel WAV/AIFF decode, the session model, the disk-backed `SampleSource` trait, the mix
# engine's `ReadAheadSource`). Every soundcraft-* line below names the same rev so the family
# holds one copy of each crate (two copies of soundcraft-model make `TrackId`/`Session` two
# types). Bump deliberately, all together; see README. (The older tag `wavecraft-pin-2026-10-12`
# keeps the app's old name on purpose: it lives on another repo, and renaming it would break old pins.)
soundcraft-audio-io = { git = "https://github.com/iannitram/soundcraft", rev = "274f7881a40fe649c1fa2f5678c2d246320a6944" }
# f27: the biquad filter designs (RBJ cookbook shelves, peaks, notch, high/low-pass), MIT OR Apache-2.0,
# from the same pinned commit as soundcraft-audio-io.
soundcraft-dsp = { git = "https://github.com/iannitram/soundcraft", rev = "274f7881a40fe649c1fa2f5678c2d246320a6944" }

# f122 (the Video panel): SoundCraft's `soundcraft-video` (MIT OR Apache-2.0: pure Rust H.264, ProRes
# and Motion JPEG decode, ISO base media demux), from the head of our fork's `ours` branch. It brings
# the `image` crate (MIT OR Apache-2.0) with its jpeg feature, for Motion JPEG.
soundcraft-video = { git = "https://github.com/iannitram/soundcraft", rev = "274f7881a40fe649c1fa2f5678c2d246320a6944" }

# f102 (C322): SoundCraft's session model (`SampleSource`, the disk-backed source trait) and its
# time crate. Licences MIT OR Apache-2.0.
soundcraft-model = { git = "https://github.com/iannitram/soundcraft", rev = "274f7881a40fe649c1fa2f5678c2d246320a6944" }
soundcraft-time = { git = "https://github.com/iannitram/soundcraft", rev = "274f7881a40fe649c1fa2f5678c2d246320a6944" }

serde_json = "1" # MIT OR Apache-2.0; already in Cargo.lock through the SoundCraft crates

# Session state for the control channel and tests (already in the tree through the model). MIT OR Apache-2.0.
# f104 (Mixer panel): the mix engine (its metering), same pin as the rest. MIT OR Apache-2.0. The mix
# crate pulls in SoundCraft's plugin hosts (CLAP, VST3, AU), which only compile into the build; none is loaded.
soundcraft-mix = { git = "https://github.com/iannitram/soundcraft", rev = "274f7881a40fe649c1fa2f5678c2d246320a6944" }
# Playing the session (f114): the mix engine renders it, the playback crate owns the output device.
soundcraft-playback = { git = "https://github.com/iannitram/soundcraft", rev = "274f7881a40fe649c1fa2f5678c2d246320a6944" }
# VST3 plugin hosting (f128): SoundCraft's vst3-host crate (MIT OR Apache-2.0), from the same pinned commit
# as the rest of the family.
soundcraft-vst3-host = { git = "https://github.com/iannitram/soundcraft", rev = "274f7881a40fe649c1fa2f5678c2d246320a6944" }
# (The former `soundcraft-model-audio` and `mix-audio-io` aliases of soundcraft-audio-io went with the
# single pin: cargo refuses one package under two names in a crate, and the family now shares one.)

rustfft = "6"
rayon = "1"
log = "0.4"
cpal = "0.16"
egui = "0.36"
eframe = { version = "0.36", default-features = false }
rfd = "0.17"
# Task 03 (the on-disk store and streamed open). Licences: symphonia MPL-2.0 (already in the tree
# through soundcraft-audio-io, same version and features so both decode alike), bytemuck
# Zlib/Apache-2.0/MIT, dirs MIT/Apache-2.0, sysinfo MIT (its "disk" feature since item 03b: free
# space on the session folder's disk), proptest MIT/Apache-2.0.
# f93 (Ogg Vorbis save). vorbis_rs 0.5 is BSD-3-Clause and vendors libvorbis/libogg (BSD-3-Clause) as C.
vorbis_rs = "0.5.6"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff", "isomp4", "aac", "alac", "adpcm", "caf", "mkv"] }
bytemuck = "1.25"
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
proptest = "1.11"
# The Linux handheld review's W7 (2026-10-16): free space asked of the session folder's own file
# system (`statvfs`) on Unix, so a tmpfs isn't matched to `/`. Already in Cargo.lock (1.1.5,
# through tempfile and others), so no new crate; its safe API keeps `unsafe` forbidden here.
# Licence Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT.
rustix = { version = "1.1", features = ["fs"] }
# Codex review CX-W2/W4 (2026-10-19): random names and tokens from the operating system's CSPRNG.
# Already in Cargo.lock (0.4.3, through other crates), so no new crate. Licence MIT OR Apache-2.0.
getrandom = "0.4"
# Item f84 (peak files): the overview is saved with postcard (MIT OR Apache-2.0, a compact serde
# format); serde is already in Cargo.lock through soundcraft-audio-io (MIT OR Apache-2.0).
serde = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }

# Roadmap A152/A153 (feature f12, 2026-10-20): Copy puts the audio on the OS clipboard as a WAV
# file entry, Paste takes one. arboard 3.6.1, MIT OR Apache-2.0, already in Cargo.lock through
# egui-winit; default features off (no image support is needed), the file-list calls need none.
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
