[package]
name = "craft-log"
description = "Self-logging for the Craft apps (ours, not upstream): CLI log file, CRAFT_LOG filter, repeat collapse, recent-line ring, build identity, test capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
craft-stage = { path = "../craft-stage" }
log = { workspace = true }

# Whole-process checks (its own main: it starts copies of itself as the program under test).
[[test]]
name = "process"
harness = false
